ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.14.0-rc.0
        cli_version_sha: f904ea561ac0ba556b251bca7ea8f54f492c7a54
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
        environment_config:
            prod:
                gha_environment: prod
    state:
        prod:
            sha: aac3eb84a401181b5489a8f3b9873fc3cae336de
            version: v0.1.0
            committed_at: "2026-07-10T10:07:04Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: aac3eb84a401181b5489a8f3b9873fc3cae336de
                    version: v0.1.0
                    deployed_at: "2026-07-10T10:07:04Z"
                    deployed_by: joshua-temple
        release:
            sha: aac3eb84a401181b5489a8f3b9873fc3cae336de
            version: v0.1.0
            committed_at: "2026-07-10T10:05:14Z"
            committed_by: github-actions[bot]
        staging:
            sha: aac3eb84a401181b5489a8f3b9873fc3cae336de
            version: v0.1.0-rc.0
            committed_at: "2026-07-10T10:03:25Z"
