ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.5.0-rc.7
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
    environment_config:
      prod:
        gha_environment: prod
  state:
    prod: {}
    release:
      sha: 14165ce51ae26bab5d4edc68d38cd595e7d94e33
      version: v0.1.0
      committed_at: "2026-06-25T20:16:52Z"
      committed_by: github-actions[bot]
    staging:
      sha: 046edf607c30215ca00ef2ca49ed3bf286849fca
      version: v0.1.0-rc.1
      committed_at: "2026-06-25T20:18:43Z"
      committed_by: joshua-temple
      builds:
        bundle:
          sha: 046edf607c30215ca00ef2ca49ed3bf286849fca
          artifact_id: bundle-046edf607c30215ca00ef2ca49ed3bf286849fca
        image:
          sha: 046edf607c30215ca00ef2ca49ed3bf286849fca
          artifact_id: image-linux-amd64
      deploys:
        app:
          sha: 046edf607c30215ca00ef2ca49ed3bf286849fca
          deployed_at: "2026-06-25T20:18:43Z"
          deployed_by: joshua-temple
