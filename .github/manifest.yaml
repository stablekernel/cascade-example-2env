ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.14.0-dryrun.51
    cli_version_sha: f904ea561ac0ba556b251bca7ea8f54f492c7a54
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
    environment_config:
      prod:
        gha_environment: prod
  state:
    staging:
      sha: 0c08a4e2feec88000e09bf06c92f8416d317ae2e
      version: v0.1.0-rc.0
      committed_at: "2026-07-10T06:39:48Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: 0c08a4e2feec88000e09bf06c92f8416d317ae2e
          deployed_at: "2026-07-10T06:39:48Z"
          deployed_by: joshua-temple
      builds:
        image:
          sha: 0c08a4e2feec88000e09bf06c92f8416d317ae2e
          artifact_id: image-linux-amd64
        bundle:
          sha: 0c08a4e2feec88000e09bf06c92f8416d317ae2e
          artifact_id: bundle-0c08a4e2feec88000e09bf06c92f8416d317ae2e
