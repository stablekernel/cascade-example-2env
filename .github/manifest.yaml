ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v1.1.2-rc.0
        cli_version_sha: 3742e04377b952a263bb48a0a0bb5905c253d603
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod: {}
        release:
            sha: 56535fa65b1e233249ed1c134a030a51cad884bd
            version: v0.1.0
            committed_at: "2026-07-24T14:28:00Z"
            committed_by: github-actions[bot]
        staging:
            sha: 56535fa65b1e233249ed1c134a030a51cad884bd
            version: v0.1.0-rc.0
            committed_at: "2026-07-24T14:25:58Z"
            committed_by: joshua-temple
            builds:
                bundle:
                    sha: 56535fa65b1e233249ed1c134a030a51cad884bd
                    artifact_id: bundle-56535fa65b1e233249ed1c134a030a51cad884bd
                image:
                    sha: 56535fa65b1e233249ed1c134a030a51cad884bd
                    artifact_id: image-linux-arm64
            deploys:
                app:
                    sha: 56535fa65b1e233249ed1c134a030a51cad884bd
                    deployed_at: "2026-07-24T14:25:58Z"
                    deployed_by: joshua-temple
    latest_release:
        version: v0.1.0
        sha: 56535fa65b1e233249ed1c134a030a51cad884bd
        released_on: "2026-07-24T14:28:00Z"
        released_by: github-actions[bot]
