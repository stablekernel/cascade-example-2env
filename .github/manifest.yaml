ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.14.0-dryrun.55
    cli_version_sha: 0b49ccc9e371d97e7bad2090e8ad96a911021168
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
    environment_config:
      prod:
        gha_environment: prod
  state:
    staging:
      sha: 090184e30ea2cf6955e9c6eec9c44b469b54893d
      version: v0.1.0-rc.0
      committed_at: "2026-07-10T21:09:39Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: 090184e30ea2cf6955e9c6eec9c44b469b54893d
          deployed_at: "2026-07-10T21:09:39Z"
          deployed_by: joshua-temple
      builds:
        image:
          sha: 090184e30ea2cf6955e9c6eec9c44b469b54893d
          artifact_id: image-linux-arm64
        bundle:
          sha: 090184e30ea2cf6955e9c6eec9c44b469b54893d
          artifact_id: bundle-090184e30ea2cf6955e9c6eec9c44b469b54893d
