ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.6.0-dryrun.13
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
    environment_config:
      prod:
        gha_environment: prod
  state:
    prod: {}
    release:
      sha: 1a3c52447a213d26d7e3762de79cbb4196d2bee6
      version: v0.1.0
      committed_at: "2026-06-28T18:52:26Z"
      committed_by: github-actions[bot]
    staging:
      sha: 2aacf6f5aaeb0367a99c99e53722f9368b7e2fa2
      version: v0.1.0-rc.1
      committed_at: "2026-06-28T18:54:08Z"
      committed_by: joshua-temple
      builds:
        bundle:
          sha: 2aacf6f5aaeb0367a99c99e53722f9368b7e2fa2
          artifact_id: bundle-2aacf6f5aaeb0367a99c99e53722f9368b7e2fa2
        image:
          sha: 2aacf6f5aaeb0367a99c99e53722f9368b7e2fa2
          artifact_id: image-linux-amd64
      deploys:
        app:
          sha: 2aacf6f5aaeb0367a99c99e53722f9368b7e2fa2
