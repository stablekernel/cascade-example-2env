        bundle:
          sha: 2af7889623a5432ddc62f28aca0f2be1f2bfa82e
          artifact_id: bundle-dispatch-sentinel-28291580096-11717
        image:
          sha: 2af7889623a5432ddc62f28aca0f2be1f2bfa82e
          artifact_id: image-linux-amd64
      deploys:
        app:
          sha: 2af7889623a5432ddc62f28aca0f2be1f2bfa82e
