ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v0.16.3-rc.0
        cli_version_sha: 8451b21446c698ec3dff9869fbc071109e7b34de
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod:
            sha: 5c356a57013b71a4d1c02167644fed69c7d4f8eb
            version: v0.1.0
            committed_at: "2026-07-17T07:48:52Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: 5c356a57013b71a4d1c02167644fed69c7d4f8eb
                    version: v0.1.0
                    deployed_at: "2026-07-17T07:48:52Z"
                    deployed_by: joshua-temple
        release:
            sha: 5c356a57013b71a4d1c02167644fed69c7d4f8eb
            version: v0.1.0
            committed_at: "2026-07-17T07:47:28Z"
