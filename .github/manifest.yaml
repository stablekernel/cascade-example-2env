ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - name: prod
        gha_environment: prod
    cli_version: v0.16.2-rc.2
    cli_version_sha: 24a911250c5f899cac8bbe97a5170286c99978fb
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact_upload:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact_upload:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
  state:
    staging:
      sha: 206145d3ad5bcdf699027c73022bbd1d2c1b592b
      version: v0.16.2-rc.2
      committed_at: "2026-07-16T22:20:59Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: 206145d3ad5bcdf699027c73022bbd1d2c1b592b
          deployed_at: "2026-07-16T22:20:59Z"
          deployed_by: joshua-temple
      builds:
        image:
          sha: 206145d3ad5bcdf699027c73022bbd1d2c1b592b
          artifact_id: image-linux-arm64
        bundle:
          sha: 206145d3ad5bcdf699027c73022bbd1d2c1b592b
          artifact_id: bundle-206145d3ad5bcdf699027c73022bbd1d2c1b592b
