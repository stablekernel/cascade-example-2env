ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - name: prod
        gha_environment: prod
    cli_version: v0.16.1-rc.0
    cli_version_sha: 58af150e041f21cb2fda5d00f32cc53f1451ab4b
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact_upload:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact_upload:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
  state:
    staging:
      sha: 7128c51452d8db48a34d00d547b447688495473e
      version: v0.1.0-rc.0
      committed_at: "2026-07-15T22:10:44Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: 7128c51452d8db48a34d00d547b447688495473e
          deployed_at: "2026-07-15T22:10:44Z"
          deployed_by: joshua-temple
      builds:
        image:
          sha: 7128c51452d8db48a34d00d547b447688495473e
          artifact_id: image-linux-arm64
        bundle:
          sha: 7128c51452d8db48a34d00d547b447688495473e
          artifact_id: bundle-7128c51452d8db48a34d00d547b447688495473e
