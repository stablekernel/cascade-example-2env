ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v0.16.5-rc.2
        cli_version_sha: 2231b2bee90615ffb66cdee3a3cfd410720df370
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod: {}
        release:
            sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
            version: v0.1.0
            committed_at: "2026-07-19T19:29:24Z"
            committed_by: github-actions[bot]
        staging:
            sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
            version: v0.1.0-rc.0
            committed_at: "2026-07-19T19:27:38Z"
            committed_by: joshua-temple
            builds:
                bundle:
                    sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
                    artifact_id: bundle-50d77f9af36ebcfd12558764ef56cfb778e20c71
                image:
                    sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
                    artifact_id: image-linux-arm64
            deploys:
                app:
                    sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
                    deployed_at: "2026-07-19T19:27:38Z"
                    deployed_by: joshua-temple
    latest_release:
        version: v0.1.0
        sha: 50d77f9af36ebcfd12558764ef56cfb778e20c71
        released_on: "2026-07-19T19:29:24Z"
        released_by: github-actions[bot]
