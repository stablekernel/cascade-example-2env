ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.14.1-dryrun.58
        cli_version_sha: 33f8865a69ee8c318876539582e15e4ccee3949e
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
        environment_config:
            prod:
                gha_environment: prod
    state:
        prod:
            sha: fd61b5049657bca2140b87297ddbfdd85fb5994b
            version: v0.1.0
            committed_at: "2026-07-11T10:14:54Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: fd61b5049657bca2140b87297ddbfdd85fb5994b
                    version: v0.1.0
                    deployed_at: "2026-07-11T10:14:54Z"
                    deployed_by: joshua-temple
        release:
            sha: fd61b5049657bca2140b87297ddbfdd85fb5994b
            version: v0.1.0
            committed_at: "2026-07-11T10:13:43Z"
            committed_by: github-actions[bot]
        staging:
            sha: fd61b5049657bca2140b87297ddbfdd85fb5994b
            version: v0.1.0-rc.0
            committed_at: "2026-07-11T10:11:59Z"
