      builds:
        bundle:
          sha: 25a08d368035c08b0cde23592e4acad1745032c2
          artifact_id: bundle-25a08d368035c08b0cde23592e4acad1745032c2
        image:
          sha: 25a08d368035c08b0cde23592e4acad1745032c2
          artifact_id: image-linux-arm64
      deploys:
        app:
          sha: 25a08d368035c08b0cde23592e4acad1745032c2
