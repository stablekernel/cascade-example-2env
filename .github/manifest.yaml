ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - prod
    cli_version: v0.5.0-rc.10
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
    environment_config:
      prod:
        gha_environment: prod
  state:
    prod: {}
    release:
      sha: 7d848cefdfa47eb6a5bba5af05b99dd4efb19688
      version: v0.1.0
      committed_at: "2026-06-26T07:57:47Z"
      committed_by: github-actions[bot]
    staging:
      sha: c1c37fec17737a9143de6d7eeb94284a6835c8a1
      version: v0.1.0-rc.1
      committed_at: "2026-06-26T07:59:48Z"
      committed_by: joshua-temple
      builds:
        bundle:
          sha: c1c37fec17737a9143de6d7eeb94284a6835c8a1
          artifact_id: bundle-c1c37fec17737a9143de6d7eeb94284a6835c8a1
        image:
          sha: c1c37fec17737a9143de6d7eeb94284a6835c8a1
          artifact_id: image-linux-arm64
      deploys:
        app:
          sha: c1c37fec17737a9143de6d7eeb94284a6835c8a1
