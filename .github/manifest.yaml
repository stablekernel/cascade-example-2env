ci:
  config:
    schema_version: 1
    trunk_branch: main
    triggers:
      - src/**
    environments:
      - staging
      - name: prod
        gha_environment: prod
    cli_version: v0.16.3-rc.1
    cli_version_sha: 708cd047998303cc463701d46233db3e4231d316
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    builds:
      - name: image
        workflow: .github/workflows/build-image.yaml
        triggers: []
        state_tags:
          - image_digest
        matrix:
          dimensions:
            arch:
              - amd64
              - arm64
            os:
              - linux
          max_parallel: 2
          fail_fast: false
        artifact_upload:
          upload: dist/**
      - name: bundle
        workflow: .github/workflows/build-bundle.yaml
        triggers: []
        artifact_upload:
          downloads:
            - image
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
    publish:
      workflow: .github/workflows/publish.yaml
    dispatch_inputs:
      force:
        type: boolean
        default: false
        description: Force re-promote
      reason:
        type: string
        description: Operator note for this manual run
    pr_preview:
      enabled: true
      comment: true
  state:
    staging:
      sha: b2d2557c3e65277f88314c8cf6dc0dadb15c92f5
      version: v0.1.0-rc.0
      committed_at: "2026-07-17T08:44:21Z"
      committed_by: joshua-temple
      deploys:
        app:
          sha: b2d2557c3e65277f88314c8cf6dc0dadb15c92f5
          deployed_at: "2026-07-17T08:44:21Z"
          deployed_by: joshua-temple
      builds:
        image:
          sha: b2d2557c3e65277f88314c8cf6dc0dadb15c92f5
          artifact_id: image-linux-amd64
        bundle:
          sha: b2d2557c3e65277f88314c8cf6dc0dadb15c92f5
          artifact_id: bundle-b2d2557c3e65277f88314c8cf6dc0dadb15c92f5
