ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.9.2-rc.0
        cli_version_sha: f697532d2785ef06951348c4430a958acb73105d
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
        environment_config:
            prod:
                gha_environment: prod
