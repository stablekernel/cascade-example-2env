ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v0.15.0-rc.1
        cli_version_sha: c25c4de6f1cad95ddb6654bf764ea6aa9e687acd
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod: {}
        release:
            sha: 19a8dae2053d25163ad22cd379296d098e03c913
            version: v0.1.0
            committed_at: "2026-07-12T17:38:34Z"
            committed_by: github-actions[bot]
        staging:
            sha: 19a8dae2053d25163ad22cd379296d098e03c913
            version: v0.1.0-rc.0
            committed_at: "2026-07-12T17:36:46Z"
            committed_by: joshua-temple
            builds:
                bundle:
                    sha: 19a8dae2053d25163ad22cd379296d098e03c913
                    artifact_id: bundle-19a8dae2053d25163ad22cd379296d098e03c913
                image:
                    sha: 19a8dae2053d25163ad22cd379296d098e03c913
                    artifact_id: image-linux-arm64
            deploys:
                app:
                    sha: 19a8dae2053d25163ad22cd379296d098e03c913
                    deployed_at: "2026-07-12T17:36:46Z"
                    deployed_by: joshua-temple
    latest_release:
        version: v0.1.0
        sha: 19a8dae2053d25163ad22cd379296d098e03c913
        released_on: "2026-07-12T17:38:34Z"
        released_by: github-actions[bot]
