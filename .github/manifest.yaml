ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v0.16.6-rc.0
        cli_version_sha: c17b74089833ecc7b24f2babee7c17f6861b1d43
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod: {}
        release:
            sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
            version: v0.1.0
            committed_at: "2026-07-20T09:10:19Z"
            committed_by: github-actions[bot]
        staging:
            sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
            version: v0.1.0-rc.0
            committed_at: "2026-07-20T09:08:33Z"
            committed_by: joshua-temple
            builds:
                bundle:
                    sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
                    artifact_id: bundle-5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
                image:
                    sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
                    artifact_id: image-linux-amd64
            deploys:
                app:
                    sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
                    deployed_at: "2026-07-20T09:08:33Z"
                    deployed_by: joshua-temple
    latest_release:
        version: v0.1.0
        sha: 5ef2e44dba97d59fb2b1549547320eed2f3b2bb3
        released_on: "2026-07-20T09:10:19Z"
        released_by: github-actions[bot]
