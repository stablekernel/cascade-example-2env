ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - name: prod
              gha_environment: prod
        cli_version: v0.16.4-rc.0
        cli_version_sha: 25b365f7f4f16de174120c30cb060b35fa63accd
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact_upload:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact_upload:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
    state:
        prod: {}
        release:
            sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
            version: v0.1.0
            committed_at: "2026-07-17T11:53:35Z"
            committed_by: github-actions[bot]
        staging:
            sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
            version: v0.1.0-rc.0
            committed_at: "2026-07-17T11:51:41Z"
            committed_by: joshua-temple
            builds:
                bundle:
                    sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
                    artifact_id: bundle-924e58d2df4aad79628fbb336633557cf4d0c1c0
                image:
                    sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
                    artifact_id: image-linux-amd64
            deploys:
                app:
                    sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
                    deployed_at: "2026-07-17T11:51:41Z"
                    deployed_by: joshua-temple
    latest_release:
        version: v0.1.0
        sha: 924e58d2df4aad79628fbb336633557cf4d0c1c0
        released_on: "2026-07-17T11:53:35Z"
        released_by: github-actions[bot]
