ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - staging
            - prod
        cli_version: v0.14.0-dryrun.54
        cli_version_sha: 26ce47121f2ec304cb8db77aa43d1c9e799d13e5
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: image
              workflow: .github/workflows/build-image.yaml
              triggers: []
              state_tags:
                - image_digest
              matrix:
                dimensions:
                    arch:
                        - amd64
                        - arm64
                    os:
                        - linux
                max_parallel: 2
                fail_fast: false
              artifact:
                upload: dist/**
            - name: bundle
              workflow: .github/workflows/build-bundle.yaml
              triggers: []
              artifact:
                downloads:
                    - image
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
        publish:
            workflow: .github/workflows/publish.yaml
        dispatch_inputs:
            force:
                type: boolean
                default: false
                description: Force re-promote
            reason:
                type: string
                description: Operator note for this manual run
        pr_preview:
            enabled: true
            comment: true
        environment_config:
            prod:
                gha_environment: prod
    state:
        prod:
            sha: 86c6c1f12db06c8fb6ed28f719617f88336a2fce
            version: v0.1.0
            committed_at: "2026-07-10T13:02:58Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: 86c6c1f12db06c8fb6ed28f719617f88336a2fce
                    version: v0.1.0
                    deployed_at: "2026-07-10T13:02:58Z"
                    deployed_by: joshua-temple
