name: build-bundle
on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
      sha:
        required: false
        type: string
      version:
        required: false
        type: string
      target_env:
        required: false
        type: string
      reason:
        required: false
        type: string
    outputs:
      artifact_id:
        description: Identifier of the produced bundle artifact
        value: ${{ jobs.run.outputs.artifact_id }}
jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.build.outputs.artifact_id }}
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist
      - name: Stub build-bundle
        id: build
        env:
          REASON: ${{ inputs.reason }}
          SHA: ${{ inputs.sha }}
        run: |
          echo "build-bundle environment=${{ inputs.environment }} sha=$SHA version=${{ inputs.version }} reason=$REASON"
          ls -R dist || true
          # When an operator dispatches with a reason, surface it verbatim in the
          # artifact_id so the value flows reason -> callback -> consolidated state.
          # Falls back to the sha on automatic (push) runs that carry no reason.
          if [ -n "$REASON" ]; then
            echo "artifact_id=bundle-${REASON}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_id=bundle-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          sleep 1
